current_profile: development
profiles:
    development:
        url: http://localhost:8080
        token: dev-token-xyz
        token_script: echo 'dynamic-script-token-xyz'
        headers: {}
commands:
    create-user:
        path: /users
        method: POST
        description: Create a new user
        headers: {}
        query: {}
        body: |
            {
              "name": "{name}",
              "email": "{email}",
              "role": "{role}"
            }
        args:
            email:
                type: ""
                description: The email address of the user
                default: ""
                required: true
            name:
                type: ""
                description: The name of the user
                default: ""
                required: true
            role:
                type: ""
                description: 'The user role (default: developer)'
                default: developer
                required: false
    get-user:
        path: /users/{id}
        method: GET
        description: Get user details by ID
        headers:
            X-Custom-Request: "yes"
        query:
            fields: '{fields}'
            v: "2"
        body: ""
        args: {}
